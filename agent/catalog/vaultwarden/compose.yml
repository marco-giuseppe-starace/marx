services:
  app:
    image: vaultwarden/server:latest
    restart: unless-stopped
    ports: ["127.0.0.1:${PORT}:80"]
    environment:
      DOMAIN: https://${DOMAIN}
      SIGNUPS_ALLOWED: ${SIGNUPS}
      TZ: ${TZ}
    volumes: [data:/data]
    mem_limit: ${MEM}
    cpus: ${CPUS}
volumes:
  data:
